; Calibre-ESP — ESP32-C3 + calibre digital (puerto SPC)
;
; Plataforma: pioarduino (Arduino core 3.x para C3; el espressif32 oficial de
; PlatformIO quedó en el core 2.0.17). Versión pineada para builds reproducibles.
; Librerías verificadas (2026-06): NimBLE-Arduino 2.x (BLE HID propio, la lib
; T-vK está rota en C3) + fork mantenido ESP32Async de ESPAsyncWebServer.

[platformio]
default_envs = esp32c3-supermini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board = esp32-c3-devkitm-1
; min_spiffs: 2 slots de app de ~1.9 MB -> entra WiFi+BLE+AsyncWeb y hay OTA
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
monitor_speed = 115200
lib_ldf_mode = chain
lib_compat_mode = strict
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.0
    ESP32Async/AsyncTCP @ ^3.4.10
    ESP32Async/ESPAsyncWebServer @ 3.11.0
    bblanchon/ArduinoJson @ ^7.4.2
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ESP32-C3 SuperMini (USB nativo: serial por USB-CDC)
[env:esp32c3-supermini]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3-DevKitM-1 (serial por puente USB-UART clásico)
[env:esp32c3-devkitm]
